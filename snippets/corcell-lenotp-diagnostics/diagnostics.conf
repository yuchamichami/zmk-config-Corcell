# Append after either slot1-lenotp snippet: keep the real PAW FPC pins.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y

# Initial USB bench check: no automatic deep sleep during diagnosis.
# Normal lenoTP artifacts retain their existing sleep settings.
CONFIG_ZMK_SLEEP=n
