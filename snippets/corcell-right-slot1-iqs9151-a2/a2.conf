# Experimental starting point for a 1 mm insulating overlay.
# Material, adhesive and air gaps are NOT calibrated by this preset.
CONFIG_I2C=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_IQS9151=y
CONFIG_INPUT_IQS9151_TPS43_A2=y
CONFIG_INPUT_IQS9151_RESOLUTION_X=3600
CONFIG_INPUT_IQS9151_RESOLUTION_Y=3300
CONFIG_INPUT_IQS9151_ATI_TARGETCOUNT=400
CONFIG_INPUT_IQS9151_TOUCH_SET_THRESHOLD=30
CONFIG_INPUT_IQS9151_TOUCH_CLEAR_THRESHOLD=26
CONFIG_INPUT_IQS9151_ALP_THRESHOLD=8
CONFIG_INPUT_IQS9151_ALP_AUTOPROX_THRESHOLD=8
CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_SPEED=30
CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_TOP_SPEED=511
CONFIG_INPUT_IQS9151_DYNAMIC_FILTER_BOTTOM_BETA=20

# First-touch profile: keep gestures off until hardware validation.
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_ENABLE=n
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_ENABLE=n
CONFIG_INPUT_IQS9151_1F_TAP_ENABLE=n
CONFIG_INPUT_IQS9151_1F_PRESSHOLD_ENABLE=n
CONFIG_INPUT_IQS9151_2F_TAP_ENABLE=n
CONFIG_INPUT_IQS9151_2F_PRESSHOLD_ENABLE=n
CONFIG_INPUT_IQS9151_2F_PINCH_ENABLE=n
CONFIG_INPUT_IQS9151_3F_TAP_ENABLE=n
CONFIG_INPUT_IQS9151_3F_PRESSHOLD_ENABLE=n
CONFIG_INPUT_IQS9151_LOG_LEVEL=0
CONFIG_PAW3222=n
