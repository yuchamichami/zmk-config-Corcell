manifest:
  version: 1.2
  defaults:
    remote: cormoran
    revision: main
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: yuchamichami
      url-base: https://github.com/yuchamichami
  projects:
    - name: zmk-west-commands
      import: true
    # Fork of sekigon-gonnoc/zmk-driver-paw3222. The only change is dropping
    # the power-down write on suspend: waking from soft-off is a reset, the
    # sensor keeps its supply across it, and with NCS strapped to GND nothing
    # can bring it back out of power-down short of pulling the cell.
    - name: zmk-driver-paw3222
      remote: yuchamichami
      revision: fc946760e7f870e512be8fce7a26cc5c004a8663
    - name: zmk-module-ble-management
    - name: zmk-feature-custom-settings
    - name: zmk-module-runtime-input-processor
    - name: zmk-module-settings-rpc
    - name: zmk-feature-input-stream
    - name: zmk-feature-module-physical-layout
    - name: zmk-feature-runtime-combo
      import: true
    - name: zmk-feature-runtime-macro
      import: true
    - name: zmk-feature-fast-keymap
    - name: zmk-feature-device-info
    - name: zmk-feature-kscan-diagnostics
      import: true
    - name: zmk-feature-watchdog
      import: true
    - name: zmk-feature-zephyr-setting-expose
    - name: zmk
      revision: main+dya
      import:
        file: app/west.yml
    - name: zephyr
      revision: v4.1.0+zmk-fixes+nrf-half-duplex-uart
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
  self:
    path: config
