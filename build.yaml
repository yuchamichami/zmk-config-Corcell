include:
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-dya-studio-xiao_ble_zmk
    snippet: corcell-right-slot1-paw3222 studio-rpc-usb-uart
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_l
    artifact-name: Corcell_L-dya-studio-xiao_ble_zmk
    snippet: corcell-left-slot1-paw3222
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset-dya-studio-xiao_ble_zmk
  # Diagnostic right half: same DYA firmware, main's sensor processing only.
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-dya-sensor-baseline-xiao_ble_zmk
    snippet: corcell-right-slot1-paw3222 studio-rpc-usb-uart corcell-sensor-baseline
  # Temporary sleep diagnostics; the standard artifacts retain 15 minutes.
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-dya-sleep-test-30s-xiao_ble_zmk
    snippet: corcell-right-slot1-paw3222 studio-rpc-usb-uart corcell-sleep-test-30s
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_l
    artifact-name: Corcell_L-dya-sleep-test-30s-xiao_ble_zmk
    snippet: corcell-left-slot1-paw3222 corcell-sleep-test-30s
  # Power-on comparison: no EC11 GPIO ownership, NCS remains tied to GND.
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-dya-no-encoder-xiao_ble_zmk
    snippet: corcell-right-slot1-paw3222 studio-rpc-usb-uart corcell-no-encoder
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_l
    artifact-name: Corcell_L-dya-no-encoder-xiao_ble_zmk
    snippet: corcell-left-slot1-paw3222 corcell-no-encoder
  # Sensor remains physically powered; disable driver/SPI/MOTION only.
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-dya-sensor-off-xiao_ble_zmk
    snippet: corcell-right-slot1-paw3222 studio-rpc-usb-uart corcell-no-encoder corcell-sensor-off
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_l
    artifact-name: Corcell_L-dya-sensor-off-xiao_ble_zmk
    snippet: corcell-left-slot1-paw3222 corcell-no-encoder corcell-sensor-off
  # A2 replaces the right PAW only; use the existing DYA left PAW firmware.
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-iqs9151-A2-1mm-no-reset
    snippet: corcell-right-slot1-iqs9151-a2 studio-rpc-usb-uart
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-iqs9151-A2-1mm-no-reset-diagnostics
    snippet: corcell-right-slot1-iqs9151-a2 zmk-usb-logging corcell-a2-diagnostics
  # Isolated bus test: deliberately no cursor input from the right sensor.
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-iqs9151-A2-RDY-probe-only
    snippet: corcell-a2-rdy-probe zmk-usb-logging
  # Compare calibration target only, retaining diagnostics and error rejection.
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-iqs9151-A2-ATI800-diagnostics
    snippet: corcell-right-slot1-iqs9151-a2 zmk-usb-logging corcell-a2-diagnostics corcell-a2-ati800
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-iqs9151-A2-ATI700-diagnostics
    snippet: corcell-right-slot1-iqs9151-a2 zmk-usb-logging corcell-a2-diagnostics corcell-a2-ati700
  - board: xiao_ble/nrf52840/zmk
    shield: corcell_r
    artifact-name: Corcell_R-iqs9151-A2-ATI700-Fine8-diagnostics
    snippet: corcell-right-slot1-iqs9151-a2 zmk-usb-logging corcell-a2-diagnostics corcell-a2-ati700 corcell-a2-fine8
