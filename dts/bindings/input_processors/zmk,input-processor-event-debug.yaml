description: Input processor that logs input events without modifying them

compatible: "zmk,input-processor-event-debug"

include: ip_zero_param.yaml

properties:
  min-interval-ms:
    type: int
    default: 0
    description: Minimum time between log lines. Use 0 to log every event.
