description: Corell dry-cell battery SoC monitoring using a voltage divider

compatible: "corell,battery-voltage-divider"

include: voltage-divider.yaml

properties:
  mv-to-pct-thresholds:
    type: array
    required: true
    description: |
      Battery millivolt thresholds for 0%, 10%, ... 100% state-of-charge
      mapping.
